
# Animal Tracker - Docker Compose for Production

version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animal-tracker-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/animal_tracker
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - PORT=5000
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend/instance:/app/instance
    networks:
      - animal-tracker-network

  # Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animal-tracker-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - animal-tracker-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: animal-tracker-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=animal_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - animal-tracker-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: animal-tracker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - animal-tracker-network

volumes:
  postgres_data:

networks:
  animal-tracker-network:
    driver: bridge

